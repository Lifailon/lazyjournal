services:
  lazyjournal:
    image: lifailon/lazyjournal:latest
    container_name: lazyjournal
    restart: unless-stopped
    privileged: true
    tty: true
    stdin_open: true
    # Forwarding a port in web mode
    # ports:
    #   - 5555:5555
    environment:
      # Flags for passing to lazyjournal
      - OPTIONS=-p /opt
      # Enable web mode
      - TTYD=false
      - PORT=5555
      # Credentials for web browser access (optional)
      - USERNAME=
      - PASSWORD=
      # Enable SSL (optional)
      - CERT=
      - KEY=
    volumes:
      # Read access to the list of units from systemd
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - /run/systemd/system:/run/systemd/system:ro
      - /run/systemd/journal/socket:/run/systemd/journal/socket:ro
      # Machine identifier for reading journald logs on the host
      - /etc/machine-id:/etc/machine-id:ro
      # System log files (syslog, messages, etc.)
      - /var/log:/var/log:ro
      # Custom logs path (optional)
      - /opt:/opt:ro
      # Reading Docker logs from socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Reading Docker logs from file system
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Kubernetes configuration
      - $HOME/.kube/config:/root/.kube/config:ro
      # Custom lazyjournal configuration (optional)
      # - ./config.yml:/lazyjournal/config.yml:ro