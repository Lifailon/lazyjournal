name: "[AI] Commit review"

on:
  workflow_dispatch:
  push:
    branches:
      - main

run-name: "Commit: ${{ github.event.head_commit.message }}"

jobs:
  tg_notify:
    name: Telegram notify

    permissions:
      contents: read
      models: read

    runs-on: ubuntu-latest

    env:
      LAST_COMMIT: 'n/a'
      DIFF_DATA: ''
      DIFF_STAT: ''

    steps:
      - name: Checkout repository (main branch and 2 last commits)
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Get diff from last commit
        run: |
          LAST_COMMIT=$(git rev-parse --short HEAD)
          echo "LAST_COMMIT=$LAST_COMMIT" >> $GITHUB_ENV
          
          DIFF_STAT=$(git diff --shortstat HEAD^ HEAD)
          echo "DIFF_STAT=$DIFF_STAT" >> $GITHUB_ENV
          
          DIFF=$(git diff HEAD^ HEAD)
          printf "DIFF_DATA<<EOF\n%s\nEOF\n" "$DIFF" >> $GITHUB_ENV

      - name: Send message to Telegram
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_API_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          debug: true
          format: markdown
          message: |
            🔔 **Action**: commit [${{ env.LAST_COMMIT }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            📁 **Repository**: ${{ github.repository }}
            👤 **User**: ${{ github.actor }}

            📊 **Stats**: ${{ env.DIFF_STAT }}
            💬 **Message**: ${{ github.event.head_commit.message }}

