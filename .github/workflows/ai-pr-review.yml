name: "[AI] PR test and review"

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  pull_request_review_comment:
    types: [created]

run-name: "${{ github.event_name == 'workflow_dispatch' && 'Unit testing only' || format('Pull Request #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) }}"

jobs:
  pr_tg_report:
    name: Telegram notification

    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

    permissions:
      issues: write
      models: read
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Send message to Telegram
        id: tg_msg
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          token: ${{ secrets.TELEGRAM_API_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          debug: true
          format: markdown
          message: |
            🔔 **Action**: ${{ github.event_name }} ${{ github.event.action }} [#${{ github.event.pull_request.number }}](${{ github.event.comment.html_url || github.event.pull_request.html_url }})

            📁 **Repository**: ${{ github.repository }}
            🌿 **Branch**: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}
            👤 **From user**: ${{ github.actor }}

            📌 **Title**: ${{ github.event.pull_request.title }}
            💬 **Description**:
            ${{ github.event.comment.body || github.event.pull_request.body }}

      - name: Send message to Telegram if there is an error sending the description
        if: failure()
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          token: ${{ secrets.TELEGRAM_API_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          debug: true
          format: markdown
          message: |
            🔔 **Action**: ${{ github.event_name }} ${{ github.event.action }} [#${{ github.event.pull_request.number }}](${{ github.event.comment.html_url || github.event.pull_request.html_url }})

            📁 **Repository**: ${{ github.repository }}
            🌿 **Branch**: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}
            👤 **From user**: ${{ github.actor }}

            📌 **Title**: ${{ github.event.pull_request.title }}

  pr_unit_test:
    name: Unit testing

    if: ${{ ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && contains(fromJSON('["opened", "synchronize"]'), github.event.action)) || github.event_name == 'workflow_dispatch' }}

    permissions:
      pull-requests: write
      contents: read
      models: read
      checks: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository from PR merge commit
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 1

      - name: Checkout repository from current branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25

      - name: Install dependencies
        run: |
          go fmt ./...
          go vet ./...
          go get ./...
          go mod tidy
          go mod verify
          go build -v ./...

      - name: Start docker containers using compose
        run: |
          version=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | jq -r .tag_name)
          curl -sSL "https://github.com/docker/compose/releases/download/$version/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          mkdir -p $HOME/.docker/cli-plugins
          cp /usr/local/bin/docker-compose $HOME/.docker/cli-plugins/docker-compose
          docker compose version
          cd docker/debian
          sed "s/TTYD=false/TTYD=true/" docker-compose.yml -i
          docker compose up -d
          docker run -d --name pinguem -p 8085:8085 -p 3005:3005 lifailon/pinguem:latest

      - name: Create pcap files
        run: |
          sudo tcpdump -i any -c 1 -w test.pcap
          gzip -c test.pcap > test.pcap.gz
          sudo tcpdump -i any -c 1 -w test.pcapng
          gzip -c test.pcapng > test.pcapng.gz
          ls -lh

      - name: Install auditd and create rules
        run: |
          sudo apt install -y auditd
          sudo auditctl -w /etc/ssh/ -p rwxa -k ssh
          sudo auditctl -w /etc/passwd -p wa -k passwd
          sudo auditctl -l

      - name: Install bat and tailspin
        run: |
          sudo apt install -y bat
          bat --version || batcat --version || true
          # sudo apt install -y tailspin
          version=$(curl -s https://api.github.com/repos/bensadeh/tailspin/releases/latest | jq -r .tag_name)
          curl -L "https://github.com/bensadeh/tailspin/releases/download/$version/tailspin-$(uname -m)-unknown-$(uname -s | tr '[:upper:]' '[:lower:]')-musl.tar.gz" -o /usr/local/bin/tailspin.tar.gz
          tar -xzf /usr/local/bin/tailspin.tar.gz -C /usr/local/bin
          mv /usr/local/bin/tspin /usr/local/bin/tailspin
          chmod +x /usr/local/bin/tailspin
          rm /usr/local/bin/*.tar.gz
          tailspin --version

      - name: Install gotestsum for junit report
        run: go install gotest.tools/gotestsum@latest

      - name: Go unit testing
        id: unitTesting
        timeout-minutes: 10
        run: sudo env "PATH=$PATH" gotestsum --format standard-verbose --junitfile report.xml -- ./... -v -cover

      - name: Publish junit report in summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "report.xml"

      - name: Publish junit report in annotations
        id: junit_report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "report.xml"

      - name: Send message to Telegram
        uses: appleboy/telegram-action@master
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.TELEGRAM_API_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          debug: true
          format: markdown
          message: |
            🔔 **Action**: unit testing for pr [#${{ github.event.pull_request.number }}](${{ github.event.comment.html_url || github.event.pull_request.html_url }})

            📁 **Repository**: ${{ github.repository }}
            👤 **From user**: ${{ github.actor }}

            💡 **Step status**: ${{ steps.unitTesting.outcome == 'success' && '✅' || '❌' }} ${{ steps.unitTesting.outcome }}

            📚 **Test results**:
            Total: ${{ steps.junit_report.outputs.total }}
            Passed: ${{ steps.junit_report.outputs.passed }}
            Skipped: ${{ steps.junit_report.outputs.skipped }}
            Retried: ${{ steps.junit_report.outputs.retried }}
            Failed: ${{ steps.junit_report.outputs.failed }}

      - name: Post AI comment on PR
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JUNIT_REPORT_SUMMARY: ${{ steps.junit_report.outputs.summary }}
        run: |
          cat <<EOF > comment_body.md
          ### 🧪 Unit testing results
          Status: ${{ steps.unitTesting.outcome == 'success' && '✅' || '❌' }} **${{ steps.unitTesting.outcome }}**
          #### 📊 Report summary
          $JUNIT_REPORT_SUMMARY
          EOF
          gh pr comment "$PR_NUMBER" --body-file comment_body.md

  pr_ai_review:
    name: AI review

    needs: [pr_unit_test]

    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && contains(fromJSON('["opened", "synchronize"]'), github.event.action) }}

    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository from PR merge commit
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 1

      - name: Checkout repository from current branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/v2/install | bash

      - name: Add opencode to PATH
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run opencode in auto mode
        run: opencode run "You are acting as a Pull Request reviewer. Analyze PR ${{ github.event.pull_request.number }}. Create a list-based report detailing all code changes, explaining their benefits or the problems they address. Evaluate the code for quality and security, identify potential bugs, and suggest improvements. Prepare a report in Markdown format, keep it concise so that it is easy to read and the core points are clear. Save the report to a file named `PR_REVIEW.md` - I will then post its contents as a response to this PR." --auto

      - name: Verify report exists and is not empty
        run: |
          if [ ! -f "PR_REVIEW.md" ]; then
            echo "::error::Файл PR_REVIEW.md не найден"
            exit 1
          fi
          if [ ! -s "PR_REVIEW.md" ]; then
            echo "::error::Файл PR_REVIEW.md пустой"
            exit 1
          fi
          BYTES=$(wc -c < PR_REVIEW.md)
          LINES=$(wc -l < PR_REVIEW.md)
          echo "Размер файла PR_REVIEW.md: $BYTES байт"
          echo "Строк в файле PR_REVIEW.md: $LINES"

      - name: Post comment to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER --body-file PR_REVIEW.md