name: "[GO] Coverage merge and update Wiki"

on:
  workflow_dispatch:
    inputs:
      Branch:
        description: 'Branch for checkout'
        required: true
        default: 'main'
      Linux:
        description: 'Run unit tests on Linux (with root)'
        default: true
        type: boolean
      Docker:
        description: 'Run unit tests for Docker (without root)'
        default: true
        type: boolean
      macOS:
        description: 'Run unit tests on macOS'
        default: true
        type: boolean
      Win:
        description: 'Run unit tests on Windows'
        default: true
        type: boolean
      Golangci:
        description: 'Add linters report from golangci'
        default: true
        type: boolean
      Shield:
        description: 'Update coverage report to Wiki'
        default: false
        type: boolean
      Wiki:
        description: 'Update Markdown report to Wiki'
        default: false
        type: boolean
      Codecov:
        description: 'Upload coverage to Codecov'
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  Linux:
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.Linux == 'true' }}

    steps:
      - name: Checkout repository (${{ github.event.inputs.Branch }} branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.Branch }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0

      - name: Code verify and check build
        run: |
          go vet ./...
          go build -v -o /dev/null ./...

      - name: Start docker containers using compose
        run: |
          version=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/docker/compose/releases/latest | jq -r .tag_name)
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          curl -sSLf "https://github.com/docker/compose/releases/download/$version/docker-compose-$os-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          mkdir -p $HOME/.docker/cli-plugins
          cp /usr/local/bin/docker-compose $HOME/.docker/cli-plugins/docker-compose
          docker compose version
          cd docker/debian
          sed "s/TTYD=false/TTYD=true/" docker-compose.yml -i
          docker compose up -d
          docker run -d --name pinguem -p 8085:8085 -p 3005:3005 lifailon/pinguem:latest

      - name: Create pcap files
        run: |
          sudo tcpdump -i any -c 1 -w test.pcap
          gzip -c test.pcap > test.pcap.gz
          sudo tcpdump -i any -c 1 -w test.pcapng
          gzip -c test.pcapng > test.pcapng.gz
          ls -lh

      - name: Install auditd and create rules
        run: |
          sudo apt install -y auditd
          sudo auditctl -w /etc/ssh/ -p rwxa -k ssh
          sudo auditctl -w /etc/passwd -p wa -k passwd
          sudo auditctl -l

      - name: Run all unit test in Linux
        continue-on-error: true
        timeout-minutes: 10
        env:
          LINES: "40"
          COLUMNS: "120"
        run: |
          sudo go test -json -cover -coverprofile linux-coverage.out ./... > test.json
          cat lazyjournal.log
          echo "\`\`\`bash" > lazyjournal-log.md
          cat lazyjournal.log >> lazyjournal-log.md
          echo "\`\`\`" >> lazyjournal-log.md

      - name: Create markdown report for Linux
        continue-on-error: true
        run: |
          mv test-report.md test-linux-report.md
          cat test-linux-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload test summary report
        uses: actions/upload-artifact@v7
        with:
          name: linux-report
          path: test-linux-report.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: linux-coverage
          path: linux-coverage.out

      - name: Upload test json report for tparse
        uses: actions/upload-artifact@v7
        with:
          name: test-json
          path: test.json

      - name: Upload lazyjournal log file
        uses: actions/upload-artifact@v7
        with:
          name: lazyjournal-log
          path: lazyjournal-log.md

  Docker:
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.Docker == 'true' }}

    steps:
      - name: Checkout repository (${{ github.event.inputs.Branch }} branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.Branch }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0

      - name: Code verify and check build
        run: |
          go vet ./...
          go build -v -o /dev/null ./...

      - name: Start docker containers using compose
        run: |
          version=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/docker/compose/releases/latest | jq -r .tag_name)
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          curl -sSLf "https://github.com/docker/compose/releases/download/$version/docker-compose-$os-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          mkdir -p $HOME/.docker/cli-plugins
          cp /usr/local/bin/docker-compose $HOME/.docker/cli-plugins/docker-compose
          docker compose version
          cd docker/debian
          sed "s/TTYD=false/TTYD=true/" docker-compose.yml -i
          docker compose up -d
          docker run -d --name pinguem -p 8085:8085 -p 3005:3005 lifailon/pinguem:latest

      - name: Run unit test for docker in Linux without root
        continue-on-error: true
        timeout-minutes: 5
        env:
          LINES: "40"
          COLUMNS: "120"
        run: go test -v --run "TestDockerContainer" -cover -coverprofile docker-coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: docker-coverage
          path: docker-coverage.out

  macOS:
    runs-on: macos-15
    if: ${{ github.event.inputs.macOS == 'true' }}

    steps:
      - name: Checkout repository (${{ github.event.inputs.Branch }} branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.Branch }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0

      - name: Code verify and check build
        run: |
          go vet ./...
          go build -v -o /dev/null ./...

      - name: Run unit test in macOS
        continue-on-error: true
        timeout-minutes: 5
        env:
          LINES: "40"
          COLUMNS: "120"
        run: sudo -E COLUMNS=80 LINES=40 go test -v --run "TestUnixFiles|TestFlags|TestCommandColor|TestCommandFuzzyFilter|TestCommandRegexFilter|TestMainInterface" -cover -coverprofile macos-coverage.out

      - name: Create markdown report for macOS
        continue-on-error: true
        run: |
          mv test-report.md test-macos-report.md
          cat test-macos-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload test summary report
        uses: actions/upload-artifact@v7
        with:
          name: macos-report
          path: test-macos-report.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: macos-coverage
          path: macos-coverage.out

  Windows:
    runs-on: windows-2022
    if: ${{ github.event.inputs.Win == 'true' }}

    steps:
      - name: Checkout repository (${{ github.event.inputs.Branch }} branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.Branch }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0

      - name: Code verify and check build
        run: |
          go vet ./...
          go build -v -o NUL ./...

      - name: Create log file for Windows
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -Path "$env:APPDATA\test" -Type Directory
          "line test" | Out-File -FilePath "$env:APPDATA\test\test.log"

      - name: Run unit test in Windows
        continue-on-error: true
        timeout-minutes: 5
        env:
          LINES: "40"
          COLUMNS: "120"
        run: go test -v --run "TestWin.*|TestFlags|TestCommandColor|TestCommandFuzzyFilter|TestCommandRegexFilter|TestMainInterface|TestMockInterface" -cover -coverprofile windows-coverage.out

      - name: Create markdown report for Windows
        continue-on-error: true
        shell: pwsh
        env:
          DEBUG: true
        run: |
          Rename-Item -Path test-report.md -NewName test-windows-report.md
          if ($env:DEBUG -eq "true") {
            Get-Content test-windows-report.md | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test summary report
        uses: actions/upload-artifact@v7
        with:
          name: windows-report
          path: test-windows-report.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: windows-coverage
          path: windows-coverage.out

  Lint:
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.Golangci == 'true' }}

    steps:
      - name: Checkout repository (${{ github.event.inputs.Branch }} branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.Branch }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0

      - name: Code verify and check build
        run: |
          go vet ./...
          go build -v -o /dev/null ./...

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint --version

      - name: Golangci verify config
        id: verifyConfig
        run: golangci-lint config verify --verbose

      - name: Get used linter lists from config
        run: |
          version=$(golangci-lint --version | grep -Eo "[0-9.]+" | head -n 1)
          echo "## Configuration" > lint-report.md
          echo "Golangci version: $version" >> lint-report.md
          echo "Verify config: ${{ steps.verifyConfig.outcome }}" >> lint-report.md
          golangci-lint linters --color=never > lint-list.md
          sed -i 's/Enabled by your configuration linters:/## Enabled linters/' lint-list.md
          sed -i 's/Disabled by your configuration linters:/## Disabled linters/' lint-list.md
          sed -i 's/ \[deprecated\]//g' lint-list.md
          sed -i -E 's/\.? \[([^]]+)\]/ (**\1**)./g' lint-list.md
          awk -F ': ' '/: / {
              print "- [" $1 "](https://golangci-lint.run/docs/linters/configuration/#" $1 ") — " $2;
              next
          } { print $0 }' lint-list.md > linters.tmp && mv linters.tmp lint-list.md
          cat "lint-list.md" >> lint-report.md

      - name: Golangci linters check for get issue list
        continue-on-error: true
        run: |
          echo "## Issues" >> lint-report.md
          golangci-lint run ./... > lint-results.md || true
          sed -n '/issues:/,$p' -i lint-results.md
          cat "lint-results.md" >> lint-report.md
          cat "lint-report.md" >> $GITHUB_STEP_SUMMARY

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: lint-report.md

  Merge:
    runs-on: ubuntu-latest
    needs: [
      Linux,
      Docker,
      macOS,
      Windows,
      Lint
    ]
    outputs:
      LINUX_COVERAGE:   ${{ steps.linux.outputs.COVERAGE }}
      DOCKER_COVERAGE:  ${{ steps.docker.outputs.COVERAGE }}
      MACOS_COVERAGE:   ${{ steps.macos.outputs.COVERAGE }}
      WIN_COVERAGE:     ${{ steps.win.outputs.COVERAGE }}
      MERGE_COVERAGE:   ${{ steps.merge.outputs.COVERAGE }}

    steps:
      - name: Checkout repository (${{ github.event.inputs.Branch }} branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.Branch }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0

      - name: Code verify and check build
        run: |
          go vet ./...
          go build -v -o /dev/null ./...

      - name: Download coverage report for Linux (with root)
        if: ${{ github.event.inputs.Linux == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: linux-coverage
          path: .

      - name: Download lazyjournal log file
        if: ${{ github.event.inputs.Linux == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: lazyjournal-log
          path: .

      - name: Output lazyjournal log to summary
        if: ${{ github.event.inputs.Linux == 'true' }}
        run: cat lazyjournal-log.md >> $GITHUB_STEP_SUMMARY

      - name: Download coverage report for Docker (without root)
        if: ${{ github.event.inputs.Docker == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: docker-coverage
          path: .

      - name: Download coverage report for macOS
        if: ${{ github.event.inputs.macOS == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: macos-coverage
          path: .

      - name: Download coverage report for Windows
        if: ${{ github.event.inputs.Win == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: windows-coverage
          path: .

      - name: Check coverage report for all tests on Linux (with root)
        if: ${{ github.event.inputs.Linux == 'true' }}
        id: linux
        run: |
          out=$(go tool cover -func linux-coverage.out)
          echo "# 🧪 Unit test coverage" >> $GITHUB_STEP_SUMMARY
          echo "![](https://raw.githubusercontent.com/wiki/Lifailon/lazyjournal/coverage.svg)" >> $GITHUB_STEP_SUMMARY
          coverTotal=$(echo "$out" | tail -n 1 | awk '{print $NF}')
          echo "COVERAGE=$coverTotal" >> $GITHUB_OUTPUT
          echo "Linux coverage: $coverTotal"
          echo "- 🐧 **Linux**: $coverTotal" >> $GITHUB_STEP_SUMMARY
          cat "$GITHUB_STEP_SUMMARY" > final-report.md

      - name: Check coverage report for Docker without root
        if: ${{ github.event.inputs.Docker == 'true' }}
        id: docker
        run: |
          out=$(go tool cover -func docker-coverage.out)
          coverTotal=$(echo "$out" | tail -n 1 | awk '{print $NF}')
          echo "COVERAGE=$coverTotal" >> $GITHUB_OUTPUT
          echo "Docker coverage: $coverTotal"
          echo "- 🐳 **Docker**: $coverTotal" >> $GITHUB_STEP_SUMMARY
          cat "$GITHUB_STEP_SUMMARY" >> final-report.md

      - name: Check coverage report for macOS
        if: ${{ github.event.inputs.macOS == 'true' }}
        id: macos
        run: |
          out=$(go tool cover -func macos-coverage.out)
          coverTotal=$(echo "$out" | tail -n 1 | awk '{print $NF}')
          echo "COVERAGE=$coverTotal" >> $GITHUB_OUTPUT
          echo "macOS coverage: $coverTotal"
          echo "- 🍏 **macOS**: $coverTotal" >> $GITHUB_STEP_SUMMARY
          cat "$GITHUB_STEP_SUMMARY" >> final-report.md

      - name: Check coverage report for Windows
        if: ${{ github.event.inputs.Win == 'true' }}
        id: win
        run: |
          out=$(go tool cover -func windows-coverage.out)
          coverTotal=$(echo "$out" | tail -n 1 | awk '{print $NF}')
          echo "COVERAGE=$coverTotal" >> $GITHUB_OUTPUT
          echo "Windows coverage: $coverTotal"
          echo "- 💻 **Windows**: $coverTotal" >> $GITHUB_STEP_SUMMARY
          cat "$GITHUB_STEP_SUMMARY" >> final-report.md

      - name: Install gocovmerge and add go bin to PATH
        run: |
          go install github.com/wadey/gocovmerge@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Merge coverage reports
        id: merge
        run: |
          gocovmerge *.out > merge-coverage.out
          out=$(go tool cover -func merge-coverage.out)
          coverTotal=$(echo "$out" | tail -n 1 | awk '{print $NF}')
          echo "COVERAGE=$coverTotal" >> $GITHUB_OUTPUT
          echo "Total after merge coverage: $coverTotal"
          echo -e "\n**Total**: $coverTotal" >> $GITHUB_STEP_SUMMARY
          echo "# 📚 Functions coverage" >> $GITHUB_STEP_SUMMARY
          {
            echo "File Line Function Coverage"
            echo "- - - -"
            echo "$out" | \
              sed -E 's/^.+\///' | \
              sed "s/:/ /g" | \
              head -n -1
          } | awk '{print "|" $1 "|" $2 "|" $3 "|" $4 "|"}' >> $GITHUB_STEP_SUMMARY
          cat "$GITHUB_STEP_SUMMARY" >> final-report.md

      - name: Download test json report for tparse
        if: ${{ github.event.inputs.Linux == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: test-json
          path: .

      - name: Install tparse
        if: ${{ github.event.inputs.Linux == 'true' }}
        run: go install github.com/mfridman/tparse@latest

      - name: Generate test markdown report using tparse
        if: ${{ github.event.inputs.Linux == 'true' }}
        run: |
          echo "# 📰 Unit test result"
          tparse -all -format=markdown -file test.json >> final-report.md
          tparse -all -format=markdown -file test.json >> $GITHUB_STEP_SUMMARY

      - name: Upload merge coverage report for Codecov
        if: ${{ github.event.inputs.Codecov == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: merge-coverage
          path: merge-coverage.out

      - name: Update HTML and coverage history reports to Wiki
        if: ${{ github.event.inputs.Shield == 'true' }}
        uses: ncruces/go-coverage-report@v0.3.3
        with:
          coverage-file: merge-coverage.out
          report: true # HTML coverage report
          chart: true  # SVG coverage history report
          amend: true
        continue-on-error: true

      - name: Download test summary report for Linux
        if: ${{ github.event.inputs.Linux == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: linux-report
          path: .

      - name: Download test summary report for macOS
        if: ${{ github.event.inputs.macOS == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: macos-report
          path: .

      - name: Download test summary report for Windows
        if: ${{ github.event.inputs.Win == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: windows-report
          path: .

      - name: Download lint report
        if: ${{ github.event.inputs.Golangci == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: lint-report
          path: .

      - name: Add golangci lint report
        if: ${{ github.event.inputs.Golangci == 'true' }}
        run: |
          echo "# 👮‍♂️ Linters check" >> final-report.md
          cat "lint-report.md" >> final-report.md

      - name: Add Linux markdown report to final report
        if: ${{ github.event.inputs.Linux == 'true' }}
        run: |
          echo "# 🐧 Linux" >> final-report.md
          echo "Log reading and coloring performance results when testing on Linux." >> final-report.md
          cat "test-linux-report.md" >> final-report.md

      - name: Add macOS markdown report to final report
        if: ${{ github.event.inputs.macOS == 'true' }}
        run: |
          echo "# 🍏 macOS" >> final-report.md
          echo "Log reading and coloring performance results when testing on macOS." >> final-report.md
          cat "test-macos-report.md" >> final-report.md

      - name: Add Windows markdown report to final report
        if: ${{ github.event.inputs.Linux == 'true' }}
        run: |
          echo "# 🪟 Windows" >> final-report.md
          echo "Log reading and coloring performance results when testing on Windows." >> final-report.md
          cat "test-windows-report.md" >> final-report.md

      - name: Add lazyjournal logs to final report
        if: ${{ github.event.inputs.Linux == 'true' }}
        run: |
          echo "# 📄 Logs" >> final-report.md
          echo "Log of executed commands during interface testing on Linux." >> final-report.md
          cat "lazyjournal-log.md" >> final-report.md

      - name: Add flags output to final report
        run: |
          echo "# 🚩 Flags" >> final-report.md
          echo "## Help" >> final-report.md
          echo "\`lazyjournal -h\`" >> final-report.md
          echo "\`\`\`bash" >> final-report.md
          go run main.go -h >> final-report.md
          echo "\`\`\`" >> final-report.md
          echo "## Configuration" >> final-report.md
          echo "\`lazyjournal -g\`" >> final-report.md
          echo "\`\`\`yaml" >> final-report.md
          go run main.go -g >> final-report.md
          echo "\`\`\`" >> final-report.md
          echo "## Audit" >> final-report.md
          echo "\`lazyjournal -a\`" >> final-report.md
          echo "\`\`\`yaml" >> final-report.md
          go run main.go -a >> final-report.md
          echo "\`\`\`" >> final-report.md

      - name: Upload final report
        uses: actions/upload-artifact@v7
        with:
          name: final-report
          path: final-report.md

  Telegram:
    runs-on: ubuntu-latest
    needs: [Merge]
    env:
      LINUX_COVERAGE:   ${{ needs.Merge.outputs.LINUX_COVERAGE  || 'n/a' }}
      DOCKER_COVERAGE:  ${{ needs.Merge.outputs.DOCKER_COVERAGE || 'n/a' }}
      MACOS_COVERAGE:   ${{ needs.Merge.outputs.MACOS_COVERAGE  || 'n/a' }}
      WIN_COVERAGE:     ${{ needs.Merge.outputs.WIN_COVERAGE    || 'n/a' }}
      MERGE_COVERAGE:   ${{ needs.Merge.outputs.MERGE_COVERAGE  || 'n/a' }}

    steps:
      - name: Send report to Telegram
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_API_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          debug: true
          format: markdown
          message: |
            🔔 **Action**: Merge coverage

            📁 **Repository**: ${{ github.repository }}
            👤 **User**: ${{ github.actor }}
            🔗 **Build**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Result unit testing coverage:
            🐧 Linux: ${{ env.LINUX_COVERAGE }}
            🐳 Docker: ${{ env.DOCKER_COVERAGE }}
            🍏 macOS: ${{ env.MACOS_COVERAGE }}
            💻 Windows: ${{ env.WIN_COVERAGE }}
            📚 Merge: ${{ env.MERGE_COVERAGE }}

  Wiki:
    runs-on: ubuntu-latest
    needs: [Merge]
    if: ${{ github.event.inputs.Wiki == 'true' }}

    steps:
      - name: Download final report from merge
        uses: actions/download-artifact@v8
        with:
          name: final-report
          path: .

      - name: Checkout Wiki repository
        run: git clone https://github.com/Lifailon/lazyjournal.wiki wiki

      - name: Update markdown report to Wiki
        run: |
          echo -e "# Report for $(go run main.go -v) release\n" > wiki/home.md
          echo -e 'The test coverage report in `html` format using [go-coverage-report](https://github.com/marketplace/actions/go-coverage-report) is available [here](https://raw.githubusercontent.com/wiki/Lifailon/lazyjournal/coverage.html).\n' >> wiki/home.md
          echo -e 'During testing, the interface operation is checked in the disabled `tcell` mode, as well as the reading and coloring time of all available logs in Linux, macOS and Windows systems.\n' >> wiki/home.md
          echo -e 'To combine test results from different systems [gosovmerge](https://github.com/wadey/gocovmerge) is used.\n' >> wiki/home.md
          echo -e '# 📈 Coverage history\n' >> wiki/home.md
          echo -e '![](https://raw.githubusercontent.com/wiki/Lifailon/lazyjournal/coverage-chart.svg)\n' >> wiki/home.md
          cat final-report.md >> wiki/home.md
          cd wiki
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add home.md
          if ! git diff --staged --quiet; then
              git diff
              git commit -m "update markdown report"
              git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Lifailon/lazyjournal.wiki.git master
          else
              echo "No changes to commit"
          fi

  Codecov:
    runs-on: ubuntu-latest
    needs: [Merge]
    if: ${{ github.event.inputs.Codecov == 'true' }}

    steps:
      - name: Checkout repository (${{ github.event.inputs.Branch }} branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.Branch }}

      - name: Download merge coverage report
        uses: actions/download-artifact@v8
        with:
          name: merge-coverage
          path: .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: merge-coverage.out
          flags: merge
          verbose: true